# Source of truth for every upstream file AuraWorx is permitted to modify.
# Adding to this list requires a separate PR with justification.
# All NEW logic goes in aura/ subdirectories, never in upstream-owned files.

upstream_tag: v0.8.5

allowed_modifications:
  - path: api/server/controllers/TwoFactorController.js
    reason: |
      DocumentDB 5.0 rejects the mixed inclusion/exclusion Mongoose projection
      emitted by upstream verify2FA/confirm2FA. Replaces with pure-inclusion.
      Upstream PR candidate.
      Tracks: AuraWorx/librechat-suite#259

  - path: api/server/routes/index.js
    reason: |
      Exports bedrockKeys and bedrockProxy routers so they are picked up by
      api/server/index.js. Entry-point only — no logic here.
      Tracks: AuraWorx/librechat-suite#276

  - path: api/server/index.js
    reason: |
      Mounts /api/bedrock-keys (CRUD) and /bedrock (proxy) routers.
      Two app.use() lines only — no other changes.
      Tracks: AuraWorx/librechat-suite#276

  - path: client/jest.config.cjs
    reason: |
      Adds client/src/components/aura/ and client/src/hooks/aura/ to the
      moduleNameMapper so Jest can resolve aura component imports in tests.
      Entry-point config only — no logic here.
      Tracks: AuraWorx/librechat-suite#276

  - path: client/src/components/Nav/Settings.tsx
    reason: |
      Adds the Bedrock API Keys tab to the LibreChat Settings dialog.
      Minimal change: one import + one tab entry in the tabs array.
      Tracks: AuraWorx/librechat-suite#276

  - path: client/src/locales/en/translation.json
    reason: |
      Adds English i18n keys for the Bedrock API Keys settings tab label.
      No other locale changes — downstream translations are additive.
      Tracks: AuraWorx/librechat-suite#276

  - path: Dockerfile
    reason: |
      Adds --legacy-peer-deps to npm ci to match the lockfile that requires it.
      Single line change in the builder stage.
      Tracks: AuraWorx/librechat-suite#276

  - path: Dockerfile.multi
    reason: |
      Adds --legacy-peer-deps to npm ci to match the lockfile that requires it.
      Single line change.
      Tracks: AuraWorx/librechat-suite#276

aura_directories:
  # Populated by Steps 2-4 of the Bedrock API Keys feature (#276).
  - api/server/controllers/aura/
  - api/server/routes/aura/
  - api/server/middleware/aura/
  - api/server/services/aura/
  - api/models/aura/
  - client/src/components/aura/
  - client/src/hooks/aura/

  # --- One-time reconciliation exception, NOT an ongoing exemption ---
  # AuraWorx/LibreChat#9 (Azure AI Foundry custom-endpoint support) is built
  # on a branch descended from the shipped fork release-tag lineage, which
  # shares no git history with this repo's `main` (main has drifted ~568
  # commits / ~300 files independently). Making that PR mergeable required
  # replacing main's stale copies of these four packages wholesale with
  # their current release-lineage content, so the branch has real shared
  # history to merge from — not because AuraWorx intends to freely modify
  # upstream package internals going forward.
  #
  # api/jest.config.js and client/package.json are listed here rather than
  # in allowed_modifications above because they're byproducts of the same
  # reconciliation (syncing Jest's esModules transform list and removing
  # unused deps pulled in by the client/package.json sync) and exceed that
  # list's 10-added-line entry-point limit — they're reconciliation
  # artifacts, not small isolated fork customizations.
  #
  # Reviewer: please treat this as a one-time parity reset tied to PR #9,
  # not a standing invitation to edit these files/packages outside the
  # normal per-file allowlist above. Remove this block once PR #9 merges
  # and bump `upstream_tag` to re-baseline the boundary contract from that
  # point.
  # Tracks: AuraWorx/LibreChat#9
  - packages/data-provider/
  - packages/api/
  - packages/data-schemas/
  - packages/client/
  - api/jest.config.js
  - client/package.json

  # api/server/controllers/UserController.js and its two test files: genuine
  # bug fixes surfaced by the reconciliation, not reconciliation churn itself.
  # packages/api's own storage/s3/index.ts was missing `export * from
  # './images'`, so S3ImageService never reached its public API surface —
  # api/server/services/Files/strategies.js does `new S3ImageService(...)`
  # at module load time, so every controller that transitively requires it
  # crashed. Separately, the reconciled packages/data-provider added
  # ResourceType.SKILL, which had no per-user cleanup call in
  # UserController.js even though packages/data-schemas already exposed
  # deleteUserSkills via createMethods. One line added to the controller,
  # plus matching updates to its two test files (mock + coverage map).
  # Tracks: AuraWorx/LibreChat#9
  - api/server/controllers/UserController.js
  - api/server/controllers/__tests__/deleteUser.spec.js
  - api/server/controllers/__tests__/deleteUserResourceCoverage.spec.js

  # Remaining Tests: api failures, each a genuine gap between an untouched
  # api/server/ or api/strategies/ file and the reconciled packages/*:
  # - api/server/controllers/UserController.spec.js: same deleteUserSkills
  #   mock gap as deleteUser.spec.js above, in a second test file for the
  #   same controller.
  # - api/strategies/openIdJwtStrategy.js(.spec.js): the reconciled
  #   packages/api's findOpenIDUser now does issuer-scoped primary lookups,
  #   requiring callers to pass openidIssuer (derived via the already-
  #   exported getOpenIdIssuer helper). Without it every JWT-based OIDC
  #   login skipped straight to the email-only fallback lookup. Scoped
  #   narrowly to just this parameter — the feature branch's version also
  #   bundles new issuer/audience allowlist validation, intentionally left
  #   out here as a separate, bigger change needing its own review.
  # - api/server/controllers/agents/client.test.js: two stale-test fixes —
  #   memory context is intentionally placed on agent.additional_instructions
  #   by applyContextToAgent (consumed downstream in packages/api's run.ts),
  #   not agent.instructions; and the test's mock MCP tools were constructed
  #   via @langchain/core's DynamicStructuredTool while extractMCPServers
  #   checks instanceof against @librechat/agents/langchain/tools's
  #   re-export, a different module reference for the same class.
  # - api/server/routes/__tests__/mcp.spec.js: redactServerSecrets() now
  #   omits url unless the caller passes {canEdit: true}; the untouched
  #   controller never does, so url is correctly redacted everywhere today.
  #   Updated assertions to match that real, current behavior rather than
  #   porting the feature branch's much larger ACL-based canEdit computation
  #   (ties into resource permissions / capability checks) — that's a
  #   separate, bigger change warranting its own review. Also fixed a
  #   hardcoded 3-minute "stale" duration to use the real PENDING_STALE_MS
  #   constant (default changed from whatever main assumed to 10 minutes).
  # - api/package.json: added traverse@0.6.8 as an explicit dependency.
  #   api/config/parsers.js requires it directly, but it was only ever
  #   present as an incidental transitive dependency on main (never
  #   declared), and the reconciled dependency tree dropped it.
  # Tracks: AuraWorx/LibreChat#9
  - api/server/controllers/UserController.spec.js
  - api/strategies/openIdJwtStrategy.js
  - api/strategies/openIdJwtStrategy.spec.js
  - api/server/controllers/agents/client.test.js
  - api/server/routes/__tests__/mcp.spec.js
  - api/package.json

  # Removed 4 now-redundant/oversized allowed_modifications entries from the
  # original Bedrock API Keys feature (#276) that this reconciliation swept
  # up: packages/data-provider/src/bedrock.ts and config.ts (already covered
  # by the packages/data-provider/ entry above), and api/package.json
  # (already covered above). Their diffs vs main ballooned past the 10-line
  # entry-point limit once those packages were reconciled wholesale — the
  # original Bedrock-specific changes are still in there, just no longer
  # separable from the reconciliation diff. Root package.json is added here
  # for the same reason: its diff vs main now includes both the original
  # Bedrock devDependency additions and unrelated reconciliation-driven
  # version bumps (turbo, typescript-eslint, various override entries)
  # picked up when syncing the lockfile.
  # Tracks: AuraWorx/LibreChat#9
  - package.json
