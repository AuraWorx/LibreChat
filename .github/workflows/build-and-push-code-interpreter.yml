name: Build and push code-interpreter image

# Triggered by pushing a tag matching code-interpreter-v* (e.g.,
# code-interpreter-v1.0.0). Builds the sandbox service from
# code-interpreter/Dockerfile (vendored from upstream LibreCodeInterpreter,
# security-patched) and publishes to
# ghcr.io/auraworx/librechat-code-interpreter:<tag>.
#
# Deliberately a separate tag pattern from build-and-push.yml's
# v*-aura.* (LibreChat's own versioning) — code-interpreter is an
# independent artifact with its own lifecycle and shouldn't be coupled to
# LibreChat's version number.

on:
  push:
    tags:
      - 'code-interpreter-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: img
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: code-interpreter
          file: code-interpreter/Dockerfile
          target: app
          platforms: linux/amd64    # match code-interpreter's EC2 launch type (nsjail needs CAP_SYS_ADMIN)
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/librechat-code-interpreter:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
